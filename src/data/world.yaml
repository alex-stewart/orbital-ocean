# ─────────────────────────────────────────────────────────────────────────────
#  THE ORBITAL OCEAN — bodies and orbits
#
#  Distances and radii are in Imperial Leagues (1 IL ≈ 1 km).
#  Every orbit is circular and runs CLOCKWISE as seen on the map.
#  `position` is the body's place in the order outward from the centre (1–16).
#  `bearing` is the compass bearing (0 = north, 90 = east) from the parent
#  body at day 0 of the calendar epoch.
#  Periods may be given as `period_years` (calendar years) or `period_days`.
#  `seed` picks the generated placeholder coastline; change it to reroll.
#  `description` (optional) is shown in the gazetteer.
#  Bodies may also carry `moons:` (same fields as an orbital) — none do yet.
#
#  Sizes, distances, bearings and periods are placeholders. Positions without
#  a name in the lore are called "Continent N" until they are named.
# ─────────────────────────────────────────────────────────────────────────────

units:
  name: Imperial League
  plural: Imperial Leagues
  abbreviation: IL

# The ocean is a perfect circle; beyond its edge lies the Gunk.
ocean:
  radius: 10800
  edge:
    name: The Endless Gunk

central:
