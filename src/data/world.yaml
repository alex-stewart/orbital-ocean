# ─────────────────────────────────────────────────────────────────────────────
#  THE ORBITAL OCEAN — bodies and orbits
#
#  Distances and radii are in Imperial Leagues (1 IL ≈ 1 km).
#  Every orbit is circular and runs CLOCKWISE as seen on the map.
#  `bearing` is the compass bearing (0 = north, 90 = east) from the parent
#  body at day 0 of the calendar epoch.
#  Periods may be given as `period_years` (calendar years) or `period_days`.
#  `seed` picks the generated placeholder coastline; change it to reroll.
#
#  Names are placeholders.
# ─────────────────────────────────────────────────────────────────────────────

units:
  name: Imperial League
  plural: Imperial Leagues
  abbreviation: IL

central:
  id: central
  name: The Central Isle
  radius: 210          # ≈ 140,000 IL², between Iceland and Great Britain
