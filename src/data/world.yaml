# Bands of tiny islands. Each islet's period scales from the inner edge as
# (r / inner_radius)^1.5, so the inner edge of a belt overtakes the outer.
belts:
  - id: war-belt
    name: War Belt
    position: 5
    seed: 42
    count: 380
    inner_radius: 2250
    outer_radius: 2550
    period_years_at_inner: 2.36
    islet_radius: [0.6, 4]

  - id: far-belt
    name: Far Belt
    position: 11
    seed: 43
    count: 460
    inner_radius: 6000
    outer_radius: 6400
    period_years_at_inner: 10.27
    islet_radius: [0.6, 4]

# The Holy Purple Bureaucratic Empire's division of the ocean.
# `inner` / `outer` may be a number (IL), a belt id, `centre` or `edge`.
bands:
  - id: home
    name: The Home Band
    inner: centre
    outer: war-belt
    description: The ocean inside of the War Belt.
  - id: second
    name: The Second Band
    inner: war-belt
    outer: far-belt
    description: The region between the War Belt and the Far Belt.
  - id: frontier
    name: The Frontier Band
    inner: far-belt
    outer: edge
    description: The region between the Far Belt and the Endless Gunk.

# ─────────────────────────────────────────────────────────────────────────────
#  OCEAN PLATFORMS
#
#  The platforms themselves are listed in src/data/platforms.yaml (sited by
#  `npm run seed -- platforms`, tuned in src/parameters/platforms.yaml). Here
#  is only what kinds exist and what they're called. Each platform has a
#  number in the Imperial register: <register>-<owner code>-<number>,
#  e.g. HPBE-P-01423.
# ─────────────────────────────────────────────────────────────────────────────

platform_register: HPBE

# Size classes, largest first. Their sizes are parameters.
platform_classes:
  - { id: grand,   name: Grand platform, like: a large cathedral }
  - { id: keep,    name: Keep,           like: a castle keep }

# Who holds platforms. `code` is the register letter; `imperial` marks the Empire.
platform_owners:
  - { id: imperial,    name: Holy Purple Bureaucratic Empire, code: P, imperial: true }
  - { id: independent, name: Independent,                     code: X }
  - { id: derelict,    name: Derelict,                        code: X }
