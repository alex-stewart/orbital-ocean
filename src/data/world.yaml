# Bands of tiny islands. Each islet's period scales from the inner edge as
# (r / inner_radius)^1.5, so the inner edge of a belt overtakes the outer.
belts:
  - id: war-belt
    name: War Belt
    position: 5
    seed: 42
    count: 380
    inner_radius: 2250
    outer_radius: 2550
    period_years_at_inner: 2.36
    islet_radius: [0.6, 4]

  - id: far-belt
    name: Far Belt
    position: 11
    seed: 43
    count: 460
    inner_radius: 6000
    outer_radius: 6400
    period_years_at_inner: 10.27
    islet_radius: [0.6, 4]

# The Holy Purple Bureaucratic Empire's division of the ocean.
# `inner` / `outer` may be a number (IL), a belt id, `centre` or `edge`.
bands:
  - id: home
    name: The Home Band
    inner: centre
    outer: war-belt
    description: The ocean inside of the War Belt.
  - id: second
    name: The Second Band
    inner: war-belt
    outer: far-belt
    description: The region between the War Belt and the Far Belt.
  - id: frontier
    name: The Frontier Band
    inner: far-belt
    outer: edge
    description: The region between the Far Belt and the Endless Gunk.

# ─────────────────────────────────────────────────────────────────────────────
#  OCEAN PLATFORMS
#
#  Platforms are generated from these rules rather than listed one by one;
#  the same seed always produces the same platforms. Each gets a number in
#  the Imperial register (HPBE-P-… for Imperial platforms, HPBE-X-… for
#  platforms the Empire registers but does not own).
#
#  Motions:
#    anchored    fixed in place, in water no orbit ever crosses
#    lane        orbiting the centre in a shared lane between continent orbits
#    convoy      sharing a continent's orbit, a fixed distance ahead or behind
#    continent   orbiting a continent, clear of its moons
#  Nothing is placed where it could ever meet a continent, moon, belt or
#  another platform; `clearance` is the minimum gap in IL.
# ─────────────────────────────────────────────────────────────────────────────

platforms:
  seed: 1
  registry: HPBE
  clearance: 20        # IL kept clear of continents, moons, belts and lanes
  spacing: 1.5         # IL between neighbouring platforms

  # How many platforms each band holds, and what share are anchored.
  bands:
    home:     { count: 1100, anchored: 0.7 }
    second:   { count: 800,  anchored: 0.25 }
    frontier: { count: 500,  anchored: 0.15 }

  # How orbital (non-anchored) platforms divide between kinds of orbit.
  orbital:
    lane: 0.45
    convoy: 0.25
    continent: 0.30

  # Size classes. `radius` in IL (1 IL ≈ 1 km); `reveal` is the zoom, in
  # pixels per IL, at which the class appears as individual symbols.
  sizes:
    - { id: grand,   name: Grand platform, like: a large cathedral, radius: 0.1,   share: 0.06, reveal: 0.12 }
    - { id: keep,    name: Keep,           like: a castle keep,     radius: 0.05,  share: 0.16, reveal: 0.35 }
    - { id: station, name: Station,        like: a manor house,     radius: 0.025, share: 0.3,  reveal: 1 }
    - { id: beacon,  name: Beacon,         like: a lighthouse,      radius: 0.008, share: 0.48, reveal: 3 }

  # Who holds them. `code` is the register letter; `imperial` marks the Empire.
  owners:
    - { id: imperial,    name: Holy Purple Bureaucratic Empire, share: 0.88, code: P, imperial: true }
    - { id: independent, name: Independent,                     share: 0.08, code: X }
    - { id: derelict,    name: Derelict,                        share: 0.04, code: X }

# ─────────────────────────────────────────────────────────────────────────────
#  SETTLEMENTS
#
#  Continents without a hand-drawn design get generated settlements. How many
#  depends on the land area and the band: the inner ocean is more densely
#  settled than the frontier. A design's own settlements always win.
# ─────────────────────────────────────────────────────────────────────────────

settlements:
  seed: 1
  # Settlements per 10,000 IL² of land, by band id.
  density:
    home: 9
    second: 3.5
    frontier: 1.4
  # Share of each size. Every continent gets at least a town, and any with
  # six or more settlements at least one city.
  mix: { city: 0.06, town: 0.26, village: 0.68 }
