# ─────────────────────────────────────────────────────────────────────────────
#  OCEAN PLATFORMS — how many, of what kind, how spaced
#  (Which size classes and owners exist, and their names, are in world.yaml.)
# ─────────────────────────────────────────────────────────────────────────────

seed: 1
clearance: 20          # IL kept clear of continents, moons, belts and lanes
spacing: 1.5           # IL between neighbouring platforms

# How many platforms each band holds, and what share are anchored.
bands:
  home:     { count: 1100, anchored: 0.7 }
  second:   { count: 800,  anchored: 0.25 }
  frontier: { count: 500,  anchored: 0.15 }

# How orbital (non-anchored) platforms divide between kinds of orbit.
orbital:
  lane: 0.45
  convoy: 0.25
  continent: 0.30

# Lanes about the centre: up to `max_per_gap` in each clear gap, if the gap is
# at least `min_gap_in_clearances` × clearance wide.
lanes:
  max_per_gap: 3
  min_gap_in_clearances: 6

# A moonless continent's platform ring sits within this × its coast's reach.
moonless_ring_reach: 1.3

# Per size class (ids as in world.yaml): radius in IL, share of platforms,
# and the zoom (px per IL) at which the class appears as symbols.
sizes:
  grand:   { radius: 0.1,   share: 0.06, reveal: 0.12 }
  keep:    { radius: 0.05,  share: 0.16, reveal: 0.35 }
  station: { radius: 0.025, share: 0.3,  reveal: 1 }
  beacon:  { radius: 0.008, share: 0.48, reveal: 3 }

# Share of platforms per owner (ids as in world.yaml).
owners:
  imperial: 0.88
  independent: 0.08
  derelict: 0.04
