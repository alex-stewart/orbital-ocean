# ─────────────────────────────────────────────────────────────────────────────
#  SETTLEMENTS — how many, how large, where
#  Used when places are seeded (`npm run seed -- places`, or the editor's
#  Regenerate); the settlements themselves live in src/data/places/.
# ─────────────────────────────────────────────────────────────────────────────

seed: 1

# Settlements per 10,000 IL² of land, by band id. Moons use their parent's band.
density:
  home: 9
  second: 3.5
  frontier: 1.4

# Settlements per 10,000 IL² of a belt's land (all its islands): a belt has as
# many places as a continent of its land would. They are shared among its
# populated archipelagos by land area, at least a village each. Islanders live
# by the sea: every shore village on a belt island is a harbour.
belt_density:
  war-belt: 18
  far-belt: 9

# Bodies settled differently from their band, by body id:
#   density  settlements per 10,000 IL² of land (0: nobody lives there)
#   coast    settle only within this many IL of the sea
bodies:
  # Hard to colonise: a few footholds on the coast, nothing inland.
  land-of-the-large: { density: 0.8, coast: 6 }
  # The heart of the Empire, the most crowded land in the ocean.
  holy-purple-homeland: { density: 24 }
  # Nobody lives on Brock.
  brock: { density: 0 }

# Share of each size: mostly villages, then towns, and a smaller but real
# number of cities.
mix:
  city: 0.10
  town: 0.25
  village: 0.65

# Minimums per body. A continent with at least `city_from` settlements has a city.
minimum:
  continent: town
  moon: village
  city_from: 6

# Closest any two places may be, by the larger of the two, in IL.
spacing:
  city: 30
  town: 14
  village: 6

# Where people settle. Score = lowness × flatness × shore ×
#   (base + fresh_water × nearness to rivers/lakes + coast × nearness to sea).
siting:
  base: 0.3
  fresh_water: 0.5
  coast: 0.3
  # Multiplier for sites right on the shore (so only some become harbours).
  shore: 0.8
  # Slope (rise over run) at which flatness has fallen to ~37%.
  gentle_slope: 0.04
  # Land regions smaller than this many cells (e.g. islands in lakes) aren't settled.
  min_region_cells: 40

# Coastal cities and towns are always harbours; coastal villages sometimes.
village_harbour_chance: 0.35
