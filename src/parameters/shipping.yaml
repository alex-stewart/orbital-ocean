# ─────────────────────────────────────────────────────────────────────────────
#  SHIPPING — Imperial cargo routes over sea
#
#  Routes are planned afresh for the date on the timeline, from each body's
#  chief port to the others, hopping between ports and resupply platforms.
#  A leg may never exceed `resupply_range`; among routes that respect it, the
#  cheapest wins, where a leg costs
#      length × (1 + open_sea × (length / resupply_range)²)
#  so long open-water legs cost more than the same distance in short hops,
#  and passing through a belt multiplies a leg's cost by `belt`.
# ─────────────────────────────────────────────────────────────────────────────

# Longest leg between resupply points, IL.
resupply_range: 1400

# Platforms that can resupply ships: these size classes, held by the Empire.
resupply_classes: [grand, keep]

open_sea: 1.5
belt: 2.5

# Keep legs this far (IL) off any coast but their own.
coast_margin: 12

# Trade between two ports ∝ (weight of A × weight of B) / distance^distance_decay,
# where a port's weight sums its body's settlements: city 6, town 2, village 0.5.
weights: { city: 6, town: 2, village: 0.5 }
distance_decay: 1

# Draw the busiest `max_routes` routes (every chief port keeps at least one).
max_routes: 28

# While time is playing, re-plan at most this often (milliseconds).
replan_interval: 250
